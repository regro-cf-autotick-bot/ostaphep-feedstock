schema_version: 1

context:
  name: OstapHEP
  version: "3.8.6.30"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OstapHEP/ostap/archive/v${{ version }}.tar.gz
  sha256: 99bb7a3b1a239f9f04e10f11099c04291a07fdff5de5e2f78ad13162aa60e419
  target_directory: ostap

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - ninja
  host:
    - root_base
    - root_cxx_standard
    - python
    - gsl
    - libblas * *openblas
    - libcblas * *openblas
    - liblapack * *openblas
    - libopenblas
    - cffi
    - pip
    - wheel
    - setuptools
    - libdb
  run:
    - python
    - ipython
    - root_base
    - gsl
    - libblas * *openblas
    - libcblas * *openblas
    - liblapack * *openblas
    - libopenblas
    - scipy
    - numpy
    - numba
    - cffi
    - pathos
    - dill
    - multiprocess
    - ppft
    - joblib
    - ipyparallel
    - zstandard
    - more-itertools
    - sortedcontainers
    - psutil
    - tabulate
    - terminaltables
    - pathvalidate
    - packaging
    - libdb
    - duckdb
    - fasteners
    - statsmodels
    - pandas
    - xgboost
    - catboost
    - lightgbm
    - sweetviz
    - hep_ml
    - py-cpuinfo
    - parallel
    - pytorch
    - h5py

tests:
  - python:
      imports:
        - ostap
        - ostap.core.core
        - ostap.core.pyrouts
      pip_check: true
  - script:
      - ostap --help
      - check-dependencies

about:
  license: BSD-3-Clause
  license_file: ostap/LICENSE
  summary: >
    The Ostap project is a community-driven initiative aiming to provide more
    user friendly and more intuitive interface to ROOT and PyROOT and extending
    the existing functionality.
  homepage: https://github.com/OstapHEP/ostap
  repository: https://github.com/OstapHEP/ostap

extra:
  recipe-maintainers:
    - TatianaOvsiannikova
    - VanyaBelyaev
